---
name: ci
on:
  push:
    branches:
    - master
    paths-ignore:
    - 'releases/*'
  pull_request:
    paths-ignore:
    - 'releases/*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@v4
      id: buildx
    - name: Run docker build for .devcontainer/Dockerfile
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        builder: ${{ steps.buildx.outputs.name }}
        file: .devcontainer/Dockerfile
        tags: mister-devel/build:stable
        load: true
        cache-from: type=gha,scope=${{ github.workflow }}
        cache-to: type=gha,scope=${{ github.workflow }},mode=max
    - name: Run make MiSTer using devcontainer
      run: |
       docker run --rm \
          --user "$(id -u):$(id -g)" \
          -v "$PWD":/usr/src \
          -w /usr/src \
          mister-devel/build:stable \
          make
       echo "filename=MiSTer_$(date +'%Y%m%d')" >>"$GITHUB_OUTPUT"
      id: build
    - name: "Upload ${{ steps.build.outputs.filename }} Artifact"
      uses: actions/upload-artifact@v7
      with:
        name: "${{ steps.build.outputs.filename }}"
        path: bin/MiSTer
        if-no-files-found: error
        retention-days: 7
